version: '3.8'

services:
  functious:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - TOKEN=${TOKEN}
      - MONGODB=${MONGODB}
      - SENTRY_DSN=${SENTRY_DSN}
      - BOTID=${BOTID}
      - CDN=${CDN}
      - CDN_KEY=${CDN_KEY}
      - API_PORT=${API_PORT:-8889}
      - API_KEY=${API_KEY}
      - WEBSITE_URL=${WEBSITE_URL}
      - FLUXER_REDIRECT_URI=${FLUXER_REDIRECT_URI}
      - FLUXER_CLIENT_SECRET=${FLUXER_CLIENT_SECRET}
      - FLUXER_CLIENT_ID=${FLUXER_CLIENT_ID}
    ports:
      - target: 8889
        published: 8889
        protocol: tcp
        mode: ingress
    volumes:
      - .:/app
      - /app/node_modules
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3